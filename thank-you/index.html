<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Thank You | Scott Steele</title>
<meta name="robots" content="noindex"/>
<link rel="stylesheet" href="/assets/css/brand.css"/>
<style>
.thank-you{background:#050A14;min-height:92vh;display:flex;align-items:center;justify-content:center;padding:60px 40px;}
.ty-box{max-width:560px;text-align:center;}
.ty-check{width:64px;height:64px;border-radius:50%;background:#B89D5A;display:flex;align-items:center;justify-content:center;margin:0 auto 28px;font-size:28px;color:#050A14;font-weight:bold;}
.ty-title{font-family:Georgia,serif;font-size:42px;color:#FAF8F4;letter-spacing:-1px;font-style:italic;margin-bottom:12px;line-height:1.05;}
.ty-title span{font-style:normal;color:#B89D5A;}
.ty-body{font-size:16px;color:#9AB0C8;line-height:1.9;font-weight:300;margin-bottom:36px;}
.ty-links{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
.ty-contact{margin-top:36px;padding-top:28px;border-top:1px solid #1F3552;}
.ty-contact-label{font-size:8px;color:#5A7A99;letter-spacing:3px;text-transform:uppercase;margin-bottom:12px;}
.ty-contact-val{font-family:Georgia,serif;font-size:22px;color:#B89D5A;}
</style>
</head>
<body>
<div id="nav-placeholder"></div>
<div class="thank-you">
  <div class="ty-box">
    <div class="ty-check">&#10003;</div>
    <div class="ty-title">Message <span>received.</span></div>
    <div class="ty-body">You will hear back from Scott directly — same day. In the meantime feel free to explore the site or reach out directly if it is urgent.</div>
    <div class="ty-links">
      <a class="btn-gold" href="/">Back to home</a>
      <a class="btn-outline" href="/markets">Explore markets</a>
    </div>
    <div class="ty-contact">
      <div class="ty-contact-label">Need a faster response?</div>
      <div class="ty-contact-val">508.813.9267</div>
      <div style="font-size:13px;color:#5A7A99;margin-top:6px;">Call or text Scott directly</div>
    </div>
  </div>
</div>
<div id="footer-placeholder"></div>
<script src="/assets/js/brand.js"></script>
<script>initPage('');</script>
</body>
</html>
